# Pull pre-built image from GitHub Container Registry (no local build):
#   docker compose pull && docker compose up -d
# Image is published on each push to main — see .github/workflows/docker-publish.yml
services:
  forum:
    image: ghcr.io/killamfkr/hive:latest
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: "change-me-openssl-rand-base64-32"
      NEXTAUTH_URL: "http://YOUR_UNRAID_IP:3000"
      DATABASE_URL: "file:/data/forum.db"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_ID_PAID: ""
      XUI_BASE_URL: ""
      XUI_API_KEY: ""
      XUI_BOUQUET_IDS: "1"
    volumes:
      - /mnt/user/appdata/hive-tech-forum:/data
